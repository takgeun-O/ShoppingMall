<!-- templates/fragments/header.html -->
<header th:fragment="siteHeader(activeTop)"
        th:with="activeTop=${activeTop ?: 'SHOP'}"
        class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">

    <!-- Top Section -->
    <div class="border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">

                <!-- Brand -->
                <a th:href="@{/}"
                   class="text-2xl font-bold text-gray-900 tracking-tight">
                    Omniora
                </a>

                <!-- Top Tabs (md+) -->
                <nav class="hidden md:flex items-center space-x-8">
                    <a th:href="@{/}"
                       class="text-sm font-medium transition-colors relative pb-1"
                       th:classappend="${activeTop=='SHOP'}
                        ? ' text-gray-900 after:absolute after:bottom-0 after:left-0 after:right-0 after:h-0.5 after:bg-gray-900'
                        : ' text-gray-500 hover:text-gray-900'">
                        쇼핑하기
                    </a>

                    <a th:href="@{/community}"
                       class="text-sm font-medium transition-colors relative pb-1"
                       th:classappend="${activeTop=='COMMUNITY'}
                        ? ' text-gray-900 after:absolute after:bottom-0 after:left-0 after:right-0 after:h-0.5 after:bg-gray-900'
                        : ' text-gray-500 hover:text-gray-900'">
                        커뮤니티
                    </a>

                    <a th:href="@{/cs}"
                       class="text-sm font-medium transition-colors relative pb-1"
                       th:classappend="${activeTop=='CS'}
                        ? ' text-gray-900 after:absolute after:bottom-0 after:left-0 after:right-0 after:h-0.5 after:bg-gray-900'
                        : ' text-gray-500 hover:text-gray-900'">
                        고객센터
                    </a>
                </nav>

                <!-- Utility Links -->
                <div class="flex items-center space-x-2 sm:space-x-4">

                    <!-- 검색 : 공통 -->
                    <a th:href="@{/search}"
                       class="inline-flex items-center justify-center rounded-md h-10 w-10 text-gray-600 hover:text-gray-900 hover:bg-gray-100">
                        <span class="sr-only">검색</span>
                        <!-- Search icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
                             viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M21 21l-4.35-4.35m1.6-5.15a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                    </a>

                    <!-- 장바구니 : 일반 사용자만 -->
                    <a th:if="${!isAdmin}"
                       th:href="@{/cart}"
                       class="inline-flex items-center justify-center rounded-md h-10 w-10 text-gray-600 hover:text-gray-900 hover:bg-gray-100">
                        <span class="sr-only">장바구니</span>
                        <!-- Shopping cart icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
                             viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13l-1.2 6h12.4M7 13L5.4 5M9 21a1 1 0 100-2 1 1 0 000 2zm10 0a1 1 0 100-2 1 1 0 000 2z"/>
                        </svg>
                    </a>

                    <!-- 로그인 안함 -->
                    <a th:if="${loginMemberId == null}"
                       th:href="@{/login}"
                       class="inline-flex items-center justify-center rounded-md h-10 w-10 text-gray-600 hover:text-gray-900 hover:bg-gray-100">
                        <span class="sr-only">로그인</span>
                        <!-- User icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
                             viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M5.12 17.8A9 9 0 1118.9 17.8M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                    </a>

                    <!-- 로그인 함 -->
                    <th:block th:if="${loginMemberId != null}">
                        <span class="text-sm text-gray-700 hidden sm:inline"
                              th:text="${loginMemberName} + '님'">
                            사용자님
                        </span>

                        <!-- 일반 사용자 & 관리자 계정 공용 -->
                        <a th:href="@{/members/me}"
                           class="inline-flex items-center justify-center rounded-md px-3 py-2 text-sm text-gray-700 hover:text-gray-900 hover:bg-gray-100">
                            마이페이지
                        </a>

                        <!-- 로그아웃: POST 유지 -->
                        <form th:action="@{/logout}" method="post" class="inline">
                            <button type="submit"
                                    class="inline-flex items-center justify-center rounded-md px-3 py-2 text-sm text-gray-700 hover:text-gray-900 hover:bg-gray-100">
                                로그아웃
                            </button>
                        </form>
                    </th:block>
                </div>

            </div>
        </div>
    </div>

    <!-- Sub Navigation -->
    <div class="bg-gray-50">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
            <div class="flex h-12 items-center space-x-6">

                <!-- SHOP : 관리자/일반사용자 공통 -->
                <th:block th:if="${activeTop=='SHOP'}">
                    <a th:href="@{/}"
                       class="text-sm font-medium text-gray-700 hover:text-gray-900">
                        쇼핑홈
                    </a>

                    <!-- Categories dropdown -->
                    <div class="relative group">
                        <button type="button"
                                class="flex items-center space-x-1 text-sm font-medium text-gray-700 hover:text-gray-900">
                            <span>카테고리</span>
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none"
                                 viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M19 9l-7 7-7-7"/>
                            </svg>
                        </button>

                        <div class="absolute left-0 top-full z-50 hidden w-48 rounded-lg border border-gray-200 bg-white py-2 shadow-lg group-hover:block">
                            <a th:each="c : ${rootCategories}"
                               th:href="@{/products(categoryId=${c.id})}"
                               th:text="${c.name}"
                               class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-gray-900">
                                카테고리명
                            </a>

                            <div th:if="${rootCategories == null || #lists.isEmpty(rootCategories)}"
                                 class="px-4 py-2 text-sm text-gray-400">
                                카테고리가 없습니다
                            </div>
                        </div>
                    </div>

                    <a th:href="@{/products(sort='best')}"
                       class="text-sm font-medium text-gray-700 hover:text-gray-900">
                        베스트상품
                    </a>

                    <a th:href="@{/products(sort='sale')}"
                       class="text-sm font-medium text-gray-700 hover:text-gray-900">
                        할인상품
                    </a>
                </th:block>

                <!-- COMMUNITY -->
                <th:block th:if="${activeTop=='COMMUNITY'}">
                    <a th:href="@{/community}"
                       class="text-sm font-medium text-gray-700 hover:text-gray-900">
                        커뮤니티홈
                    </a>
                    <a th:href="@{/community/hot}"
                       class="text-sm font-medium text-gray-700 hover:text-gray-900">
                        인기글
                    </a>
                    <a th:href="@{/community/recommend}"
                       class="text-sm font-medium text-gray-700 hover:text-gray-900">
                        제품추천글
                    </a>
                </th:block>

                <!-- CS -->
                <th:block th:if="${activeTop=='CS'}">
                    <a th:href="@{/cs}"
                       class="text-sm font-medium text-gray-700 hover:text-gray-900">
                        고객센터홈
                    </a>
                    <a th:href="@{/cs/faq}"
                       class="text-sm font-medium text-gray-700 hover:text-gray-900">
                        FAQ
                    </a>
                    <a th:href="@{/cs/inquiry}"
                       class="text-sm font-medium text-gray-700 hover:text-gray-900">
                        문의하기
                    </a>
                </th:block>

            </div>
        </div>
    </div>
</header>
