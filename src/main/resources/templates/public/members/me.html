<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/default :: layout(
          '마이페이지',
          ~{::body},
          null,
          'MYPAGE'
      )}">

<body>
<div class="bg-gray-50 min-h-screen">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- Header -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">마이페이지</h1>
            <p class="text-gray-600">
                안녕하세요,
                <span th:text="${member.name}">홍길동</span>님
            </p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- Sidebar -->
            <div class="space-y-4">

                <!-- Profile Card -->
                <div class="p-6 bg-white rounded-2xl shadow-sm border border-gray-200">
                    <div class="flex items-center gap-4 mb-6">
                        <div class="w-16 h-16 rounded-full bg-gray-300 flex items-center justify-center">
                            <span class="text-gray-600 font-bold text-xl"
                                  th:text="${#strings.substring(member.name,0,1)}">H</span>
                        </div>
                        <div>
                            <h3 class="font-semibold text-gray-900"
                                th:text="${member.name}">홍길동</h3>
                            <p class="text-sm text-gray-600"
                               th:text="${member.email}">hong@example.com</p>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <a th:href="@{/members/me/edit}"
                           class="w-full flex items-center px-4 py-2 border rounded-lg hover:bg-gray-50 text-sm">
                            회원정보 수정
                        </a>
                        <a th:href="@{/members/settings}"
                           class="w-full flex items-center px-4 py-2 border rounded-lg hover:bg-gray-50 text-sm">
                            설정
                        </a>
                    </div>
                </div>

                <!-- Membership Card -->
                <div class="p-6 bg-white rounded-2xl shadow-sm border border-gray-200">
                    <h3 class="font-semibold text-gray-900 mb-4">멤버십 혜택</h3>

                    <div class="space-y-3">

                        <div class="flex justify-between items-center">
                            <span class="text-sm text-gray-600">등급</span>
                            <span class="px-2 py-1 text-xs rounded bg-yellow-600 text-white"
                                  th:text="${member.grade}">GOLD</span>
                        </div>

                        <div class="flex justify-between items-center">
                            <span class="text-sm text-gray-600">적립금</span>
                            <span class="font-semibold text-gray-900"
                                  th:text="${#numbers.formatInteger(member.point, 3, 'COMMA')} + '원'">
                                15,000원
                            </span>
                        </div>

                        <div class="flex justify-between items-center">
                            <span class="text-sm text-gray-600">쿠폰</span>
                            <span class="font-semibold text-gray-900"
                                  th:text="${member.couponCount}">5</span>
                        </div>

                    </div>
                </div>

            </div>

            <!-- Main Content -->
            <div class="lg:col-span-2 space-y-6">

                <!-- Order Status -->
                <div class="p-6 bg-white rounded-2xl shadow-sm border border-gray-200">
                    <h2 class="text-xl font-bold text-gray-900 mb-6">주문 현황</h2>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">

                        <div class="text-center">
                            <p class="text-sm text-gray-600 mb-1">주문완료</p>
                            <p class="text-2xl font-bold text-gray-900"
                               th:text="${orderSummary.orderedCount}">2</p>
                        </div>

                        <div class="text-center">
                            <p class="text-sm text-gray-600 mb-1">결제완료</p>
                            <p class="text-2xl font-bold text-gray-900"
                               th:text="${orderSummary.paidCount}">2</p>
                        </div>

                        <div class="text-center">
                            <p class="text-sm text-gray-600 mb-1">배송준비</p>
                            <p class="text-2xl font-bold text-gray-900"
                               th:text="${orderSummary.readyCount}">1</p>
                        </div>

                        <div class="text-center">
                            <p class="text-sm text-gray-600 mb-1">배송중</p>
                            <p class="text-2xl font-bold text-gray-900"
                               th:text="${orderSummary.shippingCount}">0</p>
                        </div>

                        <div class="text-center">
                            <p class="text-sm text-gray-600 mb-1">배송완료</p>
                            <p class="text-2xl font-bold text-gray-900"
                               th:text="${orderSummary.completedCount}">12</p>
                        </div>

                        <div class="text-center">
                            <p class="text-sm text-gray-600 mb-1">주문취소</p>
                            <p class="text-2xl font-bold text-gray-900"
                               th:text="${orderSummary.canceledCount}">12</p>
                        </div>

                    </div>
                </div>

                <!-- Recent Orders -->
                <div class="p-6 bg-white rounded-2xl shadow-sm border border-gray-200">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold text-gray-900">최근 주문</h2>
                        <a th:href="@{/orders}"
                           class="text-sm border px-3 py-1 rounded hover:bg-gray-50">
                            전체보기
                        </a>
                    </div>

                    <div class="space-y-4">

                        <div th:each="order : ${recentOrders}"
                             class="flex items-center justify-between p-4 bg-gray-50 rounded-lg">

                            <div>
                                <p class="font-semibold text-gray-900 mb-1"
                                   th:text="${order.productName}">
                                    상품명
                                </p>
                                <p class="text-sm text-gray-600"
                                   th:text="${#temporals.format(order.orderedAt, 'yyyy.MM.dd')} + ' 주문'">
                                    2026.02.25 주문
                                </p>
                            </div>

                            <div class="text-right">
                                <p class="font-semibold text-gray-900 mb-1"
                                   th:text="${#numbers.formatInteger(order.totalPrice, 3, 'COMMA')} + '원'">
                                    289,000원
                                </p>
                                <span class="px-2 py-1 text-xs rounded text-white"
                                      th:text="${order.status}"
                                      th:classappend="
                                      ${order.status.name() == 'SHIPPING'} ? ' bg-green-600' :
                                      (${order.status.name() == 'COMPLETED'} ? ' bg-gray-600' :
                                      ' bg-blue-600')">
                                    배송상태
                                </span>
                            </div>

                        </div>

                    </div>
                </div>

                <!-- Quick Actions -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

                    <a th:href="@{/wishlist}"
                       class="p-6 bg-white rounded-2xl shadow-sm border border-gray-200 text-center hover:shadow-lg transition-shadow cursor-pointer">
                        <h3 class="font-semibold text-gray-900 mb-1">찜한 상품</h3>
                        <p class="text-sm text-gray-600"
                           th:text="${wishlistCount} + '개'">8개</p>
                    </a>

                    <a th:href="@{/payments}"
                       class="p-6 bg-white rounded-2xl shadow-sm border border-gray-200 text-center hover:shadow-lg transition-shadow cursor-pointer">
                        <h3 class="font-semibold text-gray-900 mb-1">결제 수단</h3>
                        <p class="text-sm text-gray-600">관리</p>
                    </a>

                    <a th:href="@{/addresses}"
                       class="p-6 bg-white rounded-2xl shadow-sm border border-gray-200 text-center hover:shadow-lg transition-shadow cursor-pointer">
                        <h3 class="font-semibold text-gray-900 mb-1">배송지</h3>
                        <p class="text-sm text-gray-600">관리</p>
                    </a>

                </div>

            </div>
        </div>
    </div>
</div>
</body>
</html>
