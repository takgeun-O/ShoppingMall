<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
        th:replace="~{layout/default :: layout('상품 목록', ~{::body}, ~{}, 'public')}">
<body>

<h1>상품 목록</h1>

<div class="container" style="display: flex; gap:24px;">

    <!-- 카테고리 필터 -->
    <aside>
        <th:block th:replace="~{fragments/categoryTree :: categoryTree(
      mode=${treeMode},
      childrenByParent=${childrenByParent},
      openIds=${openIds},
      selectedCategoryId=${selectedCategoryId},
      baseUrl=${'/products'}
  )}"/>
    </aside>

    <!-- 상품 리스트 -->
    <section class="content" style="flex:1;">
        <div class="muted" th:if="${selectedCategoryId != null}">
            선택된 카테고리: <span th:text="${selectedCategoryName}"></span>
        </div>

        <!-- 필터/정렬 -->
        <div class="flex gap-3" style="border-bottom:1px solid #eee; padding-bottom:10px; margin-bottom:20px;">

            <a class="sub-item"
               th:classappend="${sort == null} ? ' is-active' : ''"
               th:href="@{/products(categoryId=${selectedCategoryId})}">
                전체
            </a>

            <a class="sub-item"
               th:classappend="${sort == 'best'} ? ' is-active' : ''"
               th:href="@{/products(categoryId=${selectedCategoryId}, sort='best')}">
                베스트
            </a>

            <a class="sub-item"
               th:classappend="${sort == 'sale'} ? ' is-active' : ''"
               th:href="@{/products(categoryId=${selectedCategoryId}, sort='sale')}">
                할인
            </a>

        </div>

        <div th:if="${#lists.isEmpty(products)}" class="card">
            표시할 상품이 없습니다.
        </div>

        <div th:each="p : ${products}" class="card">
            <div class="flex-between">
                <a th:href="@{/products/{id}(id=${p.id})}"
                   th:text="${p.name}" class="card-title">상품명</a>
                <a th:href="@{/products/{id}(id=${p.id})}" class="btn btn-outline">보기</a>
            </div>

            <div class="card-meta" style="margin-top:8px;">
                가격: <span th:text="${p.price}"></span> 원 /
                재고: <span th:text="${p.stock}"></span>
            </div>

            <div class="muted" th:if="${p.description != null}" style="margin-top:8px;">
                <span th:text="${p.description}"></span>
            </div>
        </div>
    </section>

</div>

</body>
</html>
