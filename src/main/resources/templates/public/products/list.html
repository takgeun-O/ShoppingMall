<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/default :: layout(
          '상품 목록',
          ~{::body},
          null,
          'SHOP'
      )}">

<body>

<div class="bg-gray-50 min-h-screen">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- Header -->
        <div class="mb-8">
            <div class="flex items-start justify-between gap-4">
                <div>
                    <h1 class="mb-2 text-3xl font-bold text-gray-900"
                        th:text="${selectedCategoryName != null ? selectedCategoryName : '전체 상품'}">
                        전체 상품
                    </h1>
                    <p class="text-gray-600">
                        총 <span th:text="${#lists.size(products)}">0</span>개의 상품
                    </p>
                </div>

                <!-- 관리자 로그인 시에만 노출 -->
                <a th:if="${isAdmin == true}"
                   th:href="@{/admin/products}"
                   class="inline-flex items-center rounded-lg bg-gray-900 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-gray-800">
                    <svg xmlns="http://www.w3.org/2000/svg"
                         class="mr-2 h-4 w-4"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke="currentColor"
                         stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.607 2.296.07 2.572-1.065z"/>
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                    [관리자] 상품관리
                </a>
            </div>
        </div>

        <!-- Flash Error Message -->
        <div th:if="${error != null}"
             class="mb-6 rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800">
            <span th:text="${error}">에러 메시지</span>
        </div>

        <!-- Filters and Sorting -->
        <div class="bg-white rounded-lg shadow-sm p-4 mb-6 flex flex-wrap items-center justify-between gap-4">

            <div class="flex items-center gap-2">
                <button type="button"
                        class="inline-flex items-center px-3 py-2 text-sm border rounded-md hover:bg-gray-50">
                    <span class="mr-2">☰</span>
                    필터
                </button>

                <a th:if="${selectedCategoryId != null}"
                   th:href="@{/products(sort=${sort})}"
                   class="inline-flex items-center px-3 py-2 text-sm rounded-md hover:bg-gray-50">
                    전체보기
                </a>
            </div>

            <!-- sort select -->
            <form method="get" th:action="@{/products}">
                <input type="hidden" name="categoryId" th:value="${selectedCategoryId}"/>

                <select name="sort"
                        class="w-[180px] border rounded-md px-3 py-2 text-sm bg-white"
                        onchange="this.form.submit()">
                    <option value="latest" th:selected="${sort == 'latest'}">최신순</option>
                    <option value="best" th:selected="${sort == 'best'}">인기순</option>
                    <option value="price-low" th:selected="${sort == 'price-low'}">낮은 가격순</option>
                    <option value="price-high" th:selected="${sort == 'price-high'}">높은 가격순</option>
                    <option value="rating" th:selected="${sort == 'rating'}">평점순</option>
                </select>
            </form>
        </div>

        <!-- Products Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">

            <a th:each="p : ${products}"
               th:href="@{/products/{id}(id=${p.id}, categoryId=${selectedCategoryId}, sort=${sort})}"
               th:with="isSoldOut=${p.status.name() == 'SOLD_OUT'}"
               class="group block">

                <div class="overflow-hidden bg-white rounded-xl border border-gray-100 shadow-sm transition-all duration-300"
                     th:classappend="${isSoldOut} ? ' hover:shadow-lg' : ' hover:shadow-xl hover:-translate-y-1'">

                    <!-- Image -->
                    <div class="relative aspect-square overflow-hidden bg-gray-100">

                        <img th:src="${p.imageUrl}"
                             th:alt="${p.name}"
                             class="w-full h-full object-cover transition-transform duration-300"
                             th:classappend="${isSoldOut}
                                ? ' opacity-60 grayscale'
                                : ' group-hover:scale-105'"/>

                        <!-- Top badges -->
                        <div class="absolute top-3 left-3 flex flex-wrap items-center gap-2">
                            <span th:if="${p.badge != null}"
                                  th:text="${p.badge}"
                                  class="inline-flex items-center rounded-md px-2.5 py-1 text-xs font-semibold text-white shadow-sm"
                                  th:classappend="
                                      ${p.badge == 'BEST'} ? ' bg-blue-600' :
                                      ${p.badge == 'NEW'} ? ' bg-green-600' :
                                      ${p.badge == 'SALE'} ? ' bg-red-600' :
                                      ' bg-orange-600'">
                                BEST
                            </span>

                            <span th:if="${isSoldOut}"
                                  class="inline-flex items-center rounded-md border border-red-200 bg-red-100 px-2.5 py-1 text-xs font-semibold text-red-700">
                                품절
                            </span>
                        </div>

                        <!-- Sold out overlay -->
                        <div th:if="${isSoldOut}"
                             class="absolute inset-0 flex items-center justify-center bg-black/35">
                            <span class="inline-flex items-center rounded-full bg-red-600 px-5 py-2 text-base font-bold text-white shadow-lg">
                                품절
                            </span>
                        </div>
                    </div>

                    <!-- Content -->
                    <div class="p-4">
                        <h3 class="mb-2 font-semibold transition-colors"
                            th:classappend="${isSoldOut} ? ' text-gray-700' : ' text-gray-900 group-hover:text-blue-600'"
                            th:text="${p.name}">
                            상품명
                        </h3>

                        <!-- Rating -->
                        <div class="flex items-center mb-3">
                            <span class="text-yellow-500">★</span>
                            <span class="ml-1 text-sm text-gray-600"
                                  th:text="|${p.rating} (${p.reviews})|">
                                4.8 (123)
                            </span>
                        </div>

                        <!-- Price -->
                        <div class="mb-1 flex items-baseline gap-2">
                            <span class="text-xl font-bold"
                                  th:classappend="${isSoldOut} ? ' text-gray-400' : ' text-gray-900'"
                                  th:text="${#numbers.formatInteger(p.price, 0, 'COMMA')} + '원'">
                                289,000원
                            </span>

                            <span th:if="${p.originalPrice != null}"
                                  class="text-sm text-gray-400 line-through"
                                  th:text="${#numbers.formatInteger(p.originalPrice, 0, 'COMMA')} + '원'">
                                350,000원
                            </span>
                        </div>

                        <!-- Discount / stock -->
                        <div class="min-h-[24px]">
                            <div th:if="${p.originalPrice != null and !isSoldOut}">
                                <span class="text-sm font-semibold text-red-600"
                                      th:text="${T(java.lang.Math).round((1 - (p.price * 1.0) / p.originalPrice) * 100)} + '% 할인'">
                                    10% 할인
                                </span>
                            </div>

                            <div th:if="${isSoldOut}">
                                <span class="text-sm font-medium text-red-600">
                                    현재 재고가 모두 소진되었습니다.
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </a>

        </div>

        <!-- Empty -->
        <div th:if="${#lists.isEmpty(products)}"
             class="mt-12 text-center text-gray-500">
            등록된 상품이 없습니다.
        </div>

    </div>
</div>

</body>
</html>
