<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/default :: layout('상품 상세', ~{::body}, ~{::headExtra}, 'admin')}">

<th:block th:fragment="headExtra">
    <style>
        .wrap {
            max-width: 720px;
            margin: 0 auto;
        }
        .box {
            border: 1px solid #ddd;
            padding: 16px;
        }
    </style>
</th:block>

<body>

<div class="wrap">
    <h1>상품 상세</h1>

    <div class="box">
        <h2 th:text="${product.name}">상품명</h2>

        <div class="muted">
            상품ID: <span th:text="${product.id}"></span>
        </div>

        <p>
            가격: <strong><span th:text="${product.price}"></span></strong>
        </p>

        <p class="muted">
            재고: <span th:text="${product.stock}"></span>
        </p>

        <p th:if="${product.description != null}">
            <span th:text="${product.description}"></span>
        </p>

        <div class="actions">
            <a class="btn" th:href="@{/admin/products}">목록으로</a>

            <a class="btn" th:href="@{/admin/orders/new(productId=${product.id})}">주문하기</a>
        </div>
    </div>
</div>

</body>
</html>
