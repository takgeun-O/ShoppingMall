<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/default :: layout(
          '상품 등록',
          ~{::body},
          null,
          'ADMIN'
      )}">

<body>

<div class="min-h-screen bg-gray-50">
    <div class="mx-auto max-w-4xl px-4 py-8 sm:px-6 lg:px-8">

        <!-- Back Button -->
        <a th:href="@{/admin/products}"
           class="mb-6 inline-flex items-center text-sm text-gray-600 transition-colors hover:text-gray-900">
            <span class="mr-1 text-base leading-none">←</span>
            <span>상품 목록으로 돌아가기</span>
        </a>

        <!-- Header -->
        <div class="mb-8">
            <div class="mb-3 flex items-center gap-3">
                <div class="flex h-12 w-12 items-center justify-center rounded-lg bg-blue-100">
                    <span class="text-2xl text-blue-600">📦</span>
                </div>
                <div>
                    <h1 class="text-3xl font-bold text-gray-900">상품 등록</h1>
                    <p class="text-gray-600">스토어에 새 상품을 추가합니다</p>
                </div>
            </div>
        </div>

        <!-- Form Card -->
        <div class="rounded-2xl border border-gray-200 bg-white p-8 shadow-sm">
            <form th:action="@{/admin/products}"
                  th:object="${form}"
                  method="post"
                  novalidate
                  class="space-y-6">

                <!-- Global Errors -->
                <div th:if="${#fields.hasGlobalErrors()}"
                     class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800">
                    <ul class="list-disc space-y-1 pl-5">
                        <li th:each="e : ${#fields.globalErrors()}" th:text="${e}">에러 메시지</li>
                    </ul>
                </div>

                <!-- Product Name -->
                <div>
                    <label for="name" class="text-sm font-semibold text-gray-900">
                        상품명 <span class="text-red-500">*</span>
                    </label>
                    <input id="name"
                           type="text"
                           th:field="*{name}"
                           placeholder="상품명을 입력하세요"
                           class="mt-2 w-full rounded-lg border px-4 py-3 text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2"
                           th:classappend="${#fields.hasErrors('name')} ? ' border-red-500 focus:ring-red-500' : ' border-gray-300 focus:ring-gray-900'" />
                    <p th:if="${#fields.hasErrors('name')}"
                       th:errors="*{name}"
                       class="mt-1 text-sm text-red-600">
                        상품명 에러
                    </p>
                </div>

                <!-- Category -->
                <div>
                    <label for="categoryId" class="text-sm font-semibold text-gray-900">
                        카테고리 <span class="text-red-500">*</span>
                    </label>
                    <select id="categoryId"
                            th:field="*{categoryId}"
                            class="mt-2 w-full rounded-lg border bg-white px-4 py-3 text-sm text-gray-900 focus:outline-none focus:ring-2"
                            th:classappend="${#fields.hasErrors('categoryId')} ? ' border-red-500 focus:ring-red-500' : ' border-gray-300 focus:ring-gray-900'">
                        <option value="">카테고리를 선택하세요</option>
                        <option th:each="category : ${categories}"
                                th:value="${category.id}"
                                th:text="${category.name}">
                            카테고리명
                        </option>
                    </select>
                    <p th:if="${#fields.hasErrors('categoryId')}"
                       th:errors="*{categoryId}"
                       class="mt-1 text-sm text-red-600">
                        카테고리 에러
                    </p>
                </div>

                <!-- Price / Original Price -->
                <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
                    <div>
                        <label for="price" class="text-sm font-semibold text-gray-900">
                            판매가 (₩) <span class="text-red-500">*</span>
                        </label>
                        <input id="price"
                               type="number"
                               th:field="*{price}"
                               placeholder="0"
                               min="1"
                               class="mt-2 w-full rounded-lg border px-4 py-3 text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2"
                               th:classappend="${#fields.hasErrors('price')} ? ' border-red-500 focus:ring-red-500' : ' border-gray-300 focus:ring-gray-900'" />
                        <p th:if="${#fields.hasErrors('price')}"
                           th:errors="*{price}"
                           class="mt-1 text-sm text-red-600">
                            판매가 에러
                        </p>
                    </div>

                    <div>
                        <label for="originalPrice" class="text-sm font-semibold text-gray-900">
                            정가 (₩)
                        </label>
                        <p class="mb-2 text-xs text-gray-500">선택 입력 - 할인 표시용</p>
                        <input id="originalPrice"
                               type="number"
                               th:field="*{originalPrice}"
                               placeholder="0"
                               min="1"
                               class="w-full rounded-lg border px-4 py-3 text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2"
                               th:classappend="${#fields.hasErrors('originalPrice')} ? ' border-red-500 focus:ring-red-500' : ' border-gray-300 focus:ring-gray-900'" />
                        <p th:if="${#fields.hasErrors('originalPrice')}"
                           th:errors="*{originalPrice}"
                           class="mt-1 text-sm text-red-600">
                            정가 에러
                        </p>
                    </div>
                </div>

                <!-- Stock -->
                <div>
                    <label for="stock" class="text-sm font-semibold text-gray-900">
                        재고 수량 <span class="text-red-500">*</span>
                    </label>
                    <input id="stock"
                           type="number"
                           th:field="*{stock}"
                           placeholder="0"
                           min="0"
                           class="mt-2 w-full rounded-lg border px-4 py-3 text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2"
                           th:classappend="${#fields.hasErrors('stock')} ? ' border-red-500 focus:ring-red-500' : ' border-gray-300 focus:ring-gray-900'" />
                    <p th:if="${#fields.hasErrors('stock')}"
                       th:errors="*{stock}"
                       class="mt-1 text-sm text-red-600">
                        재고 수량 에러
                    </p>
                </div>

                <!-- Description -->
                <div>
                    <label for="description" class="text-sm font-semibold text-gray-900">
                        상품 설명 <span class="text-red-500">*</span>
                    </label>
                    <textarea id="description"
                              th:field="*{description}"
                              rows="6"
                              placeholder="상품에 대한 상세 설명을 입력하세요..."
                              class="mt-2 w-full resize-none rounded-lg border px-4 py-3 text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2"
                              th:classappend="${#fields.hasErrors('description')} ? ' border-red-500 focus:ring-red-500' : ' border-gray-300 focus:ring-gray-900'"></textarea>
                    <p th:if="${#fields.hasErrors('description')}"
                       th:errors="*{description}"
                       class="mt-1 text-sm text-red-600">
                        설명 에러
                    </p>
                </div>

                <!-- Image URL -->
                <div>
                    <label for="imageUrl" class="text-sm font-semibold text-gray-900">
                        상품 이미지 URL <span class="text-red-500">*</span>
                    </label>
                    <input id="imageUrl"
                           type="url"
                           th:field="*{imageUrl}"
                           placeholder="https://example.com/product-image.jpg"
                           class="mt-2 w-full rounded-lg border px-4 py-3 text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2"
                           th:classappend="${#fields.hasErrors('imageUrl')} ? ' border-red-500 focus:ring-red-500' : ' border-gray-300 focus:ring-gray-900'" />
                    <p th:if="${#fields.hasErrors('imageUrl')}"
                       th:errors="*{imageUrl}"
                       class="mt-1 text-sm text-red-600">
                        이미지 URL 에러
                    </p>

                    <div th:if="${form.imageUrl != null and !#strings.isEmpty(form.imageUrl) and !#fields.hasErrors('imageUrl')}"
                         class="mt-4 rounded-lg bg-gray-50 p-4">
                        <p class="mb-2 text-sm font-medium text-gray-700">이미지 미리보기:</p>
                        <img th:src="${form.imageUrl}"
                             alt="상품 미리보기"
                             class="h-auto w-full max-w-xs rounded-lg border border-gray-200" />
                    </div>
                </div>

                <!-- Status -->
                <div>
                    <label for="status" class="text-sm font-semibold text-gray-900">
                        상품 상태 <span class="text-red-500">*</span>
                    </label>
                    <select id="status"
                            th:field="*{status}"
                            class="mt-2 w-full rounded-lg border border-gray-300 bg-white px-4 py-3 text-sm text-gray-900 focus:outline-none focus:ring-2"
                            th:classappend="${#fields.hasErrors('status')} ? ' border-red-500 focus:ring-red-500' : ' border-gray-300 focus:ring-gray-900'">
                        <option value="">상품 상태를 선택하세요</option>
                        <option th:each="status : ${productStatuses}"
                                th:value="${status}"
                                th:text="${status.displayName}"
                                th:attr="data-description=${status.description}">
                            상태명
                        </option>
                    </select>

                    <p th:if="${#fields.hasErrors('status')}"
                       th:errors="*{status}"
                       class="mt-1 text-sm text-red-600">
                        상품 상태 에러
                    </p>

                    <p id="statusDescription"
                       class="mt-2 text-xs text-gray-500"
                       th:text="${form.status != null ? form.status.description : '상품 상태를 선택해 주세요.'}">
                        상태 설명
                    </p>
                </div>

                <!-- Actions -->
                <div class="flex flex-col-reverse gap-4 border-t pt-6 sm:flex-row">
                    <a th:href="@{/admin/products}"
                       class="inline-flex w-full items-center justify-center rounded-lg border border-gray-300 bg-white px-5 py-3 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-50 sm:w-auto">
                        취소
                    </a>

                    <button type="submit"
                            class="inline-flex w-full items-center justify-center rounded-lg bg-gray-900 px-5 py-3 text-sm font-medium text-white shadow-sm transition-colors hover:bg-gray-800 sm:flex-1">
                        상품 등록
                    </button>
                </div>
            </form>
        </div>

        <!-- Helper Text -->
        <div class="mt-6 rounded-lg border border-blue-200 bg-blue-50 p-4">
            <p class="text-sm text-gray-700">
                <strong class="text-gray-900">Tip:</strong>
                필수 항목을 정확히 입력해 주세요.
                상품 등록 후에도 관리자 상품 관리 화면에서 수정할 수 있습니다.
            </p>
        </div>
    </div>
</div>

<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {
        const statusSelect = document.getElementById("status");
        const descriptionEl = document.getElementById("statusDescription");

        function updateStatusDescription() {
            const selectedOption = statusSelect.options[statusSelect.selectedIndex];
            const description = selectedOption.getAttribute("data-description");

            descriptionEl.textContent = description || "상품 상태를 선택해 주세요.";
        }

        statusSelect.addEventListener("change", updateStatusDescription);
        updateStatusDescription();
    });
</script>
</body>
</html>
