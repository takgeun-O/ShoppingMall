<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout(
          '상품 등록',
          ~{::content},
          'products'
      )}">

<th:block th:fragment="content">
    <th:block th:replace="~{admin/products/_form :: productForm(
        @{/admin/products},
        '상품 등록',
        '상품 등록',
        '스토어에 새 상품을 추가합니다.',
        '상품 목록으로 돌아가기',
        'Tip:',
        '필수 항목을 정확히 입력해 주세요. 상품 등록 후에도 관리자 상품 관리 화면에서 수정할 수 있습니다.',
        'bg-gray-900 hover:bg-gray-800',
        'bg-blue-100',
        'text-blue-600'
    )}">
    </th:block>
</th:block>

</html>
