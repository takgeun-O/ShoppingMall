<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout(
          '상품 수정',
          ~{::content},
          'products'
      )}">

<th:block th:fragment="content">
    <th:block th:replace="~{admin/products/_form :: productForm(
        @{/admin/products/{id}/edit(id=${productId})},
        '수정 완료',
        '상품 수정',
        '상품 정보를 수정하세요.',
        '상품 관리로 돌아가기',
        '안내:',
        '수정 내용은 저장 즉시 반영됩니다. 저장 전에 입력값을 다시 확인해주세요.',
        'bg-indigo-600 hover:bg-indigo-700',
        'bg-indigo-100',
        'text-indigo-600'
    )}">
    </th:block>
</th:block>

</html>
