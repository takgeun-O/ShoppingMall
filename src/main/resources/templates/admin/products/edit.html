<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/default :: layout(
          '상품 수정',
          ~{::body},
          null,
          'ADMIN'
      )}">

<body>

<div class="bg-gray-50 min-h-screen">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- Back Button -->
        <div class="mb-6">
            <a th:href="@{/admin/products}"
               class="inline-flex items-center text-sm text-gray-600 transition hover:text-gray-900">
                <svg xmlns="http://www.w3.org/2000/svg"
                     class="mr-1 h-4 w-4"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor"
                     stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
                </svg>
                상품 관리로 돌아가기
            </a>
        </div>

        <!-- Header -->
        <div class="mb-8">
            <div class="mb-3 flex items-center gap-3">
                <div class="flex h-12 w-12 items-center justify-center rounded-lg bg-indigo-100">
                    <svg xmlns="http://www.w3.org/2000/svg"
                         class="h-6 w-6 text-indigo-600"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke="currentColor"
                         stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-3xl font-bold text-gray-900">상품 수정</h1>
                    <p class="text-gray-600">상품 정보를 수정하세요</p>
                </div>
            </div>
        </div>

        <!-- Form Card -->
        <div class="rounded-xl border border-gray-200 bg-white p-8 shadow-sm">
            <form th:action="@{/admin/products/{id}/edit(id=${productId})}"
                  th:object="${form}"
                  method="post"
                  class="space-y-6">

                <!-- 상품명 -->
                <div>
                    <label for="name" class="text-sm font-semibold text-gray-900">상품명 *</label>
                    <input id="name"
                           type="text"
                           th:field="*{name}"
                           placeholder="상품명을 입력하세요"
                           class="mt-2 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
                    <p th:if="${#fields.hasErrors('name')}"
                       th:errors="*{name}"
                       class="mt-1 text-sm text-red-600">상품명 오류</p>
                </div>

                <!-- 가격 / 정가 -->
                <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
                    <div>
                        <label for="price" class="text-sm font-semibold text-gray-900">판매가 (₩) *</label>
                        <input id="price"
                               type="number"
                               th:field="*{price}"
                               placeholder="0"
                               class="mt-2 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
                        <p th:if="${#fields.hasErrors('price')}"
                           th:errors="*{price}"
                           class="mt-1 text-sm text-red-600">가격 오류</p>
                    </div>

                    <div>
                        <label for="originalPrice" class="text-sm font-semibold text-gray-900">정가 (₩)</label>
                        <p class="mb-2 text-xs text-gray-500">선택 입력 - 할인 표시용</p>
                        <input id="originalPrice"
                               type="number"
                               th:field="*{originalPrice}"
                               placeholder="0"
                               class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
                        <p th:if="${#fields.hasErrors('originalPrice')}"
                           th:errors="*{originalPrice}"
                           class="mt-1 text-sm text-red-600">정가 오류</p>
                    </div>
                </div>

                <!-- 재고 -->
                <div>
                    <label for="stock" class="text-sm font-semibold text-gray-900">재고 수량 *</label>
                    <input id="stock"
                           type="number"
                           th:field="*{stock}"
                           placeholder="0"
                           class="mt-2 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
                    <p th:if="${#fields.hasErrors('stock')}"
                       th:errors="*{stock}"
                       class="mt-1 text-sm text-red-600">재고 오류</p>
                </div>

                <!-- 카테고리 -->
                <div>
                    <label for="categoryId" class="text-sm font-semibold text-gray-900">카테고리 *</label>
                    <select id="categoryId"
                            th:field="*{categoryId}"
                            class="mt-2 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="">카테고리를 선택하세요</option>
                        <option th:each="category : ${categories}"
                                th:value="${category.id}"
                                th:text="${category.name}">
                            카테고리명
                        </option>
                    </select>
                    <p th:if="${#fields.hasErrors('categoryId')}"
                       th:errors="*{categoryId}"
                       class="mt-1 text-sm text-red-600">카테고리 오류</p>
                </div>

                <!-- 설명 -->
                <div>
                    <label for="description" class="text-sm font-semibold text-gray-900">상품 설명 *</label>
                    <textarea id="description"
                              th:field="*{description}"
                              rows="6"
                              placeholder="상품 설명을 입력하세요"
                              class="mt-2 w-full resize-none rounded-lg border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                    <p th:if="${#fields.hasErrors('description')}"
                       th:errors="*{description}"
                       class="mt-1 text-sm text-red-600">설명 오류</p>
                </div>

                <!-- 이미지 URL -->
                <div>
                    <label for="imageUrl" class="text-sm font-semibold text-gray-900">상품 이미지 URL *</label>
                    <input id="imageUrl"
                           type="url"
                           th:field="*{imageUrl}"
                           placeholder="https://example.com/product-image.jpg"
                           class="mt-2 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
                    <p th:if="${#fields.hasErrors('imageUrl')}"
                       th:errors="*{imageUrl}"
                       class="mt-1 text-sm text-red-600">이미지 URL 오류</p>

                    <div th:if="${form.imageUrl != null and !#strings.isEmpty(form.imageUrl)}"
                         class="mt-4 rounded-lg bg-gray-50 p-4">
                        <p class="mb-2 text-sm font-medium text-gray-700">이미지 미리보기</p>
                        <img th:src="${form.imageUrl}"
                             alt="상품 이미지 미리보기"
                             class="h-auto w-full max-w-xs rounded-lg border border-gray-200"
                             onerror="this.style.display='none'"/>
                    </div>
                </div>

                <!-- 상태 -->
                <div>
                    <label for="status" class="text-sm font-semibold text-gray-900">상품 상태 *</label>
                    <select id="status"
                            th:field="*{status}"
                            class="mt-2 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="ON_SALE">판매중</option>
                        <option value="HIDDEN">숨김</option>
                        <option value="READY">준비중</option>
                        <option value="DISCONTINUED">판매종료</option>
                    </select>
                    <p th:if="${#fields.hasErrors('status')}"
                       th:errors="*{status}"
                       class="mt-1 text-sm text-red-600">상태 오류</p>
                </div>

                <!-- 글로벌 에러 -->
                <div th:if="${#fields.hasGlobalErrors()}"
                     class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
                    <ul class="space-y-1">
                        <li th:each="err : ${#fields.globalErrors()}"
                            th:text="${err}">에러 메시지</li>
                    </ul>
                </div>

                <!-- Buttons -->
                <div class="flex flex-col-reverse gap-4 border-t pt-6 sm:flex-row">
                    <a th:href="@{/admin/products}"
                       class="inline-flex w-full items-center justify-center rounded-lg border border-gray-300 bg-white px-4 py-3 text-sm font-semibold text-gray-700 transition hover:bg-gray-50 sm:w-auto">
                        취소
                    </a>

                    <button type="submit"
                            class="inline-flex w-full items-center justify-center rounded-lg bg-indigo-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-indigo-700 sm:flex-1">
                        수정 완료
                    </button>
                </div>
            </form>
        </div>

        <!-- Info Box -->
        <div class="mt-6 rounded-lg border border-indigo-200 bg-indigo-50 p-4">
            <p class="text-sm text-gray-700">
                <strong class="text-gray-900">안내:</strong>
                수정 내용은 저장 즉시 반영됩니다. 저장 전에 입력값을 다시 확인해주세요.
            </p>
        </div>

    </div>
</div>

</body>
</html>
