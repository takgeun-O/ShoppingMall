<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/default :: layout('상품 목록', ~{::body}, ~{}, 'admin')}">

<body>

<h1>상품 목록</h1>

<div class="container" style="display: flex; gap:24px;">

    <!-- 카테고리 필터 -->
    <aside>
        <th:block th:replace="~{fragments/categoryTree :: categoryTree(
      mode=${treeMode},
      childrenByParent=${childrenByParent},
      openIds=${openIds},
      selectedCategoryId=${selectedCategoryId},
      baseUrl=${'/admin/products'}
  )}"/>
    </aside>

    <!-- 상품 리스트 -->
    <section class="content" style="flex:1;">
        <div class="muted" th:if="${selectedCategoryId != null}">
            선택된 카테고리: <span th:text="${selectedCategoryName}"></span>
        </div>

        <div th:if="${#lists.isEmpty(products)}" class="card">
            표시할 상품이 없습니다.
        </div>

        <div th:each="p : ${products}" class="card">
            <div class="flex-between">
                <a th:href="@{/admin/products/{id}(id=${p.id})}"
                   th:text="${p.name}" class="card-title">상품명</a>
                <a th:href="@{/admin/products/{id}(id=${p.id})}" class="btn btn-outline">보기</a>
            </div>

            <div class="card-meta" style="margin-top:8px;">
                가격: <span th:text="${p.price}"></span> 원 /
                재고: <span th:text="${p.stock}"></span>
            </div>

            <div class="muted" th:if="${p.description != null}" style="margin-top:8px;">
                <span th:text="${p.description}"></span>
            </div>
        </div>
    </section>

</div>

</body>
</html>
