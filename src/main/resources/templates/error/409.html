<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/default :: layout('404 Not Found', ~{::body})}">

<body>
<div class="wrap error-page">
    <h1>404</h1>
    <h2>페이지를 찾을 수 없습니다.</h2>
    <p th:text="${message} ?: '요청하신 페이지가 존재하지 않습니다.'"></p>
    <div class="actions">
        <a href="/" class="btn">홈으로</a>
    </div>
</div>
</body>
</html>
