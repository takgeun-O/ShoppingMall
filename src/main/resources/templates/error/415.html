<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/default :: layout(
            '415 Unsupported Media Type',
            ~{::body},
            ~{::headExtra},
            'PUBLIC'
      )}">

<head>
    <th:block th:fragment="headExtra">
        <!-- 필요하면 여기서 에러 페이지 전용 CSS/메타 추가 -->
    </th:block>
</head>

<body>
<div class="wrap error-page">
    <h1>415</h1>
    <h2>지원하지 않는 요청 형식입니다.</h2>
    <p th:text="${message} ?: '지원하지 않는 Content-Type 입니다.'"></p>
    <div class="actions">
        <a href="/" class="btn">홈으로</a>
    </div>
</div>
</body>
</html>
