<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/default :: layout('409 Conflict', ~{::body})}">

<body>
<div class="wrap error-page">
    <h1>409</h1>
    <h2>충돌이 발생했습니다.</h2>
    <p th:text="${message} ?: '이미 존재하는 데이터입니다.'"></p>
    <div class="actions">
        <a href="/" class="btn">홈으로</a>
    </div>
</div>
</body>
</html>
