<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/default :: layout(
            '400 Bad Request',
            ~{::body},
            ~{::headExtra},
            'PUBLIC'
      )}">

<head>
    <th:block th:fragment="headExtra">
        <!-- 필요하면 여기서 에러 페이지 전용 CSS/메타 추가 -->
    </th:block>
</head>

<body>
<div class="wrap error-page">
    <h1>400</h1>
    <h2>잘못된 요청입니다.</h2>
    <p th:text="${message} ?: '요청 값이 올바르지 않습니다.'"></p>
    <div class="actions">
        <a href="/" class="btn">홈으로</a>
        <a href="javascript:history.back()" class="btn secondary">뒤로가기</a>
    </div>
</div>
</body>
</html>
