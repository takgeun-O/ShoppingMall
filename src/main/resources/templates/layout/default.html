<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
        th:fragment="layout(pageTitle, content, pageHead, headerMode)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} ?: 'Omniora'">ShoppingMall</title>

    <!-- 공통 CSS -->
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <!-- 페이지별 추가 head 영역 -->
    <th:block th:if="${pageHead != null}" th:replace="${pageHead}"></th:block>
</head>
<body>

<!-- 공통 헤더 -->
<div th:replace="~{fragments/header :: siteHeader(activeTop=${activeTop}, treeMode=${headerMode} ?: 'public')}"></div>

<!-- 페이지 내용 영역 -->
<main class="container">
    <!-- flash message -->
    <div th:replace="~{fragments/flash :: flash}"></div>

    <!-- 페이지별 컨텐츠 -->
    <div th:replace="${content}"></div>
</main>

<!-- 공통 풋터 -->
<div th:replace="~{fragments/footer :: siteFooter}"></div>

<script th:src="@{/js/app.js}"></script>
<script>
    document.addEventListener('click', (e) => {
        const btn = e.target.closest('.cat-toggle');
        if (!btn) return;

        const li = btn.closest('.cat-node');
        if (!li) return;

        const children = li.querySelector(':scope > .cat-children');
        if (!children) return;

        const isClosed = children.classList.contains('is-closed');

        if (isClosed) {
            children.classList.remove('is-closed');
            btn.textContent = '▾';
            btn.setAttribute('aria-expanded', 'true');
        } else {
            children.classList.add('is-closed');
            btn.textContent = '▸';
            btn.setAttribute('aria-expanded', 'false');
        }
    });
</script>
</body>
</html>
