<!-- templates/layout/default.html -->
<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content, headExtra, activeTop)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Omniora</title>

    <link rel="stylesheet" th:href="@{/css/tailwind.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">

    <th:block th:if="${headExtra != null}">
        <th:block th:replace="${headExtra}"></th:block>
    </th:block>
</head>

<body class="min-h-screen bg-white text-gray-900">
<div class="min-h-screen flex flex-col">
    <div th:replace="~{fragments/header :: siteHeader(${activeTop})}"></div>

    <main class="flex-1">
        <th:block th:replace="${content}"></th:block>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
</body>
</html>
