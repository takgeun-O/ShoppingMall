<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/default :: layout('상품 목록', ~{::body}, ~{}, 'public')}">

<body>

<h1>회원가입</h1>

<div th:if="${success}" th:text="${success}" style="color: green;"></div>
<div th:if="${error}" th:text="${error}" style="color: red;"></div>

<form th:action="@{/signup}" th:object="${form}" method="post">

    <div>
        <label>이메일</label><br/>
        <input type="text" th:field="*{email}"/>
        <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:red;"></div>
    </div>

    <div style="margin-top: 10px;">
        <label>비밀번호</label><br/>
        <input type="password" th:field="*{password}"/>
        <div th:if="${#fields.hasErrors('password')}" th:text="${#fields.errors('password')[0]}" style="color:red;"></div>
    </div>

    <div style="margin-top: 10px;">
        <label>이름</label><br/>
        <input type="text" th:field="*{name}"/>
        <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:red;"></div>
    </div>

    <div style="margin-top: 10px;">
        <label>전화번호</label><br/>
        <input type="text" th:field="*{phone}" placeholder="010-1234-5678"/>
        <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" style="color:red;"></div>
    </div>

    <div style="margin-top: 14px;">
        <button type="submit">가입하기</button>
        <a th:href="@{/login}" style="margin-left: 8px;">로그인</a>
    </div>
</form>

</body>
</html>
