<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/default :: layout(
          '로그인',
          ~{::body},
          null,
          'ACCOUNT'
      )}">

<body>

<div class="min-h-screen bg-gray-50 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full p-8 bg-white rounded-lg shadow-sm">

        <!-- Title -->
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-gray-900 mb-2">로그인</h2>
            <p class="text-gray-600">Omniora에 오신 것을 환영합니다</p>
        </div>

        <!-- 안내 메시지 -->
        <div th:if="${infoMessage != null}"
             class="mb-4 rounded-md border border-blue-200 bg-blue-50 px-4 py-3 text-sm text-blue-800"
             th:text="${infoMessage}">
            안내 메시지
        </div>

        <!-- 성공 메시지 -->
        <div th:if="${success != null}"
             class="mb-4 rounded-md border border-green-200 bg-green-50 px-4 py-3 text-sm text-green-800"
             th:text="${success}">
            성공 메시지
        </div>

        <div th:if="${errorMessage != null}"
             class="mb-4 rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800"
             th:text="${errorMessage}">
            오류 메시지
        </div>

        <!-- Form -->
        <form class="space-y-6"
              th:action="@{/login(next=${next})}"
              th:object="${form}"
              method="post" novalidate>

            <!-- 글로벌 에러(로그인 실패 등등) -->
            <div th:if="${#fields.hasGlobalErrors()}"
                 class="mb-4 rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800">
                <ul class="list-disc pl-5 space-y-1">
                    <li th:each="e : ${#fields.globalErrors()}" th:text="${e}">에러</li>
                </ul>
            </div>

            <!-- Email -->
            <div>
                <label for="email" class="block text-sm font-semibold text-gray-900 mb-2">
                    이메일
                </label>

                <input id="email"
                       type="email"
                       placeholder="이메일을 입력하세요"
                       class="w-full border rounded-md px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-200"
                       th:field="*{email}"
                       th:classappend="${#fields.hasErrors('email')} ? ' border-red-400 focus:ring-red-200' : ' border-gray-200'"/>

                <p th:if="${#fields.hasErrors('email')}"
                   class="mt-2 text-sm text-red-600"
                   th:errors="*{email}">
                    이메일 오류
                </p>
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block text-sm font-semibold text-gray-900 mb-2">
                    비밀번호
                </label>

                <input id="password"
                       type="password"
                       placeholder="비밀번호를 입력하세요"
                       class="w-full border rounded-md px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-200"
                       th:field="*{password}"
                       th:classappend="${#fields.hasErrors('password')} ? ' border-red-400 focus:ring-red-200' : ' border-gray-200'"/>

                <p th:if="${#fields.hasErrors('password')}"
                   class="mt-2 text-sm text-red-600"
                   th:errors="*{password}">
                    비밀번호 오류
                </p>
            </div>

            <!-- Keep login / Forgot password -->
            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center">
                    <input type="checkbox" class="mr-2"/>
                    <span class="text-gray-600">로그인 상태 유지</span>
                </label>

                <!-- 아직 기능 없으면 #으로 유지 -->
                <a th:href="@{#}" class="text-blue-600 hover:text-blue-800">
                    비밀번호 찾기
                </a>
            </div>

            <!-- Submit -->
            <button type="submit"
                    class="w-full rounded-md bg-gray-900 text-white py-3 font-semibold hover:bg-gray-800 transition-colors">
                로그인
            </button>
        </form>

        <!-- Separator -->
        <div class="my-6 border-t border-gray-200"></div>

        <!-- Signup -->
        <div class="text-center">
            <p class="text-sm text-gray-600 mb-4">아직 회원이 아니신가요?</p>
            <a th:href="@{/signup}"
               class="w-full inline-flex items-center justify-center rounded-md border border-gray-300 bg-white py-3 font-semibold hover:bg-gray-50 transition-colors">
                회원가입
            </a>
        </div>

        <!-- Social login (UI only) -->
        <div class="mt-6">
            <p class="text-xs text-gray-500 text-center mb-4">간편 로그인</p>
            <div class="grid grid-cols-3 gap-3">
                <button type="button"
                        class="w-full rounded-md border border-gray-300 bg-white py-2 text-sm font-semibold hover:bg-gray-50">
                    카카오
                </button>
                <button type="button"
                        class="w-full rounded-md border border-gray-300 bg-white py-2 text-sm font-semibold hover:bg-gray-50">
                    네이버
                </button>
                <button type="button"
                        class="w-full rounded-md border border-gray-300 bg-white py-2 text-sm font-semibold hover:bg-gray-50">
                    구글
                </button>
            </div>
        </div>

    </div>
</div>

</body>
</html>
