spring:
  profiles:
    active: demo, mybatis
  application:
    name: shop-service
  sql:
    init:
      mode: never

  datasource:
      url: ${DB_URL:jdbc:mysql://localhost:3306/shoppingmall?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: io.github.takgeun.shop
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    org.mybatis: debug
    org.mybatis.spring: debug
    com.zaxxer.hikari: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true