spring:
    application:
        name: shop-service
    sql:
        init:
            mode: always
            schema-locations: classpath:schema.sql
            data-locations: []

    datasource:
        url: jdbc:mysql://localhost:3306/shoppingmall_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
        username: root
        password: 1234
        driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
    mapper-locations: classpath:mapper/**/*.xml
    type-aliases-package: io.github.takgeun.shop
    configuration:
        map-underscore-to-camel-case: true
        log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
    level:
        org.mybatis: DEBUG
        org.mybatis.spring: DEBUG
        org.springframework.jdbc: DEBUG
        jdbc.sqlonly: DEBUG
        com.zaxxer.hikari: DEBUG